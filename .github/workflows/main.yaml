name: Build and Release

env:
  RELEASE: 5.0.0.43

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Clone build action
      uses: actions/checkout@v6
      with:
        repository: coderus/github-sfos-build
        ref: master
        path: .github/actions/sfos-build

    # Save build results to RPMS folder for compatibility with other sfos-build scripts (even though they aren't RPM files)
    - name: Modify docker script
      run: |
        cat <<EOF > .github/actions/sfos-build/docker.sh
        set -ex

        mkdir -p tg_owt
        cd tg_owt
        cp -r /workspace/. .
        mkdir -p out build
        cd build

        mb2 -t SailfishOS-\${INPUT_RELEASE}-\${INPUT_ARCH} build-init
        mb2 -t SailfishOS-\${INPUT_RELEASE}-\${INPUT_ARCH} build-shell --maintain zypper install -y \
            cmake ninja ccache pkgconfig\(openssl\) ninja ccache git \
            libjpeg-turbo-devel ffmpeg-devel opus-devel libvpx-devel pulseaudio-devel
        if [ "\${INPUT_ARCH}" = "i486" ]; then
            mb2 -t SailfishOS-\${INPUT_RELEASE}-\${INPUT_ARCH} build-shell --maintain zypper install -y nasm yasm
        fi

        mb2 -t SailfishOS-\${INPUT_RELEASE}-\${INPUT_ARCH} build-shell cmake .. -GNinja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DTG_OWT_PACKAGED_BUILD=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            -DTG_OWT_USE_PIPEWIRE=OFF \
            -DTG_OWT_USE_X11=OFF \
            -DTG_OWT_BUILD_AUDIO_BACKENDS=ON \
            -DCMAKE_INSTALL_PREFIX:PATH=../out
        mb2 -t SailfishOS-\${INPUT_RELEASE}-\${INPUT_ARCH} build-shell cmake --build . --target install
        mb2 -t SailfishOS-\${INPUT_RELEASE}-\${INPUT_ARCH} build-shell strip --strip-unneeded ../out/lib/*.a

        mkdir -p /workspace/RPMS/\${INPUT_ARCH}/lib /workspace/RPMS/include
        cp -r ../out/lib/*.a /workspace/RPMS/\${INPUT_ARCH}/lib/
        cp -r ../out/include/. /workspace/RPMS/include/
        EOF
      shell: bash

    - name: Build ${{ matrix.arch }} on ${{ env.RELEASE }}
      uses: ./.github/actions/sfos-build
      with:
        release: ${{ env.RELEASE }}
        arch: ${{ matrix.arch }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.arch }}-SailfishOS-${{ env.RELEASE }}
        path: RPMS/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.ref, 'v')
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: tg_owt
        pattern: build-*
        merge-multiple: true

    - name: Create release
      run: |
        set -x

        cd tg_owt
        zip -r ../tg_owt.zip .
        cd ..

        tag_name="${GITHUB_REF##*/}"
        gh release create "$tag_name" tg_owt.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}